<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بلوت تراثي</title><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#151b17;color:#f7ecd5;font-family:'IBM Plex Sans Arabic',sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#1b2920;border-bottom:1px solid #8b7046}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 17px;background:#d2ae6b;color:#1b211b;font-weight:700}button:disabled{opacity:.35;cursor:not-allowed}.board{min-height:80vh;max-width:1100px;margin:15px auto;border:12px ridge #78552e;border-radius:45%;background:radial-gradient(ellipse,#2e6848,#16432e 80%);position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;box-shadow:0 15px 60px #0008}.player{position:absolute;text-align:center;font-weight:700}.north{top:14px;left:50%;transform:translateX(-50%)}.west{left:20px;top:44%}.east{right:20px;top:44%}.south{bottom:20px;left:50%;transform:translateX(-50%);width:92%}.hand{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}.card{width:65px;height:94px;background:#fff9eb;color:#191919;border:2px solid #ddcaa8;border-radius:8px;box-shadow:2px 5px 9px #0007;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:23px;line-height:1.15;transition:transform .2s}.card.red{color:#b1282d}.card.back{background:repeating-linear-gradient(45deg,#8c2d29 0 7px,#f0d0a0 7px 9px,#542921 9px 15px);border:5px solid #fff0d4}.hand button.card:hover{transform:translateY(-13px)}.played{display:flex;gap:10px;justify-content:center;align-items:center;min-height:110px}.played .card{width:65px}.tag{font-size:12px;background:#0007;border-radius:8px;padding:4px 9px;margin:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.status{text-align:center;max-width:90%;background:#10271edb;border:1px solid #c7a469;padding:9px 20px;border-radius:12px}.score{font-size:15px}.picker{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.picker button{background:#eee0c0}.face{font-size:30px}.tiny{font-size:11px}@media(max-width:700px){.board{border-radius:30px;min-height:82vh;border-width:7px}.card{width:38px;height:62px;font-size:15px}.face{font-size:21px}.played .card{width:40px;height:62px}.west{left:3px}.east{right:3px}.north{top:6px}.south{bottom:12px}.hand{gap:2px}.tag{font-size:10px}}
</style></head><body><header><strong>بلوت تراثي</strong><span class="score" id="score">نحن 0 — هم 0</span><button onclick="newDeal()">توزيعة جديدة</button></header><main class="board"><div class="player north">أبو فهد (شريك)<div class="tag" id="n">0 ورق</div></div><div class="player west">أبو سعد<div class="tag" id="w">0 ورق</div></div><div class="player east">أبو ناصر<div class="tag" id="e">0 ورق</div></div><div class="status" id="status">ابدأ توزيعة جديدة</div><div class="played" id="played"></div><div class="picker" id="picker"></div><div class="player south"><div class="tag">أنت</div><div class="hand" id="hand"></div></div></main><script>
const suits=['♠','♥','♦','♣'],ranks=['7','8','9','J','Q','K','10','A'];let hands=[],trick=[],turn=0,leader=0,mode='sun',trump=null,phase='idle',scores=[0,0],round=[0,0],won=[0,0],up=null,stock=[],dealer=3,passes=0,buyer=-1;
const team=i=>i%2===0?0:1;
function rank(c){return (mode==='hokm'&&c.s===trump?['7','8','Q','K','10','A','9','J']:['7','8','9','J','Q','K','10','A']).indexOf(c.r)}
function value(c){if(mode==='hokm'&&c.s===trump)return {'J':20,'9':14,'A':11,'10':10,'K':4,'Q':3}[c.r]||0;return {'A':11,'10':10,'K':4,'Q':3,'J':2}[c.r]||0}
function card(c,back=false){return '<div class="card '+(back?'back':('♥♦'.includes(c.s)?'red':''))+'">'+(back?'':'<b>'+c.r+'</b><span class="face">'+c.s+'</span>')+'</div>'}
function say(s){document.getElementById('status').textContent=s}
function newDeal(){let deck=suits.flatMap(s=>ranks.map(r=>({s,r})));for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}hands=[[],[],[],[]];for(let k=0;k<5;k++)for(let i=0;i<4;i++)hands[i].push(deck.pop());up=deck.pop();stock=deck;trick=[];round=[0,0];won=[0,0];phase='bid';mode='sun';trump=null;passes=0;buyer=-1;turn=(dealer+1)%4;render();bidTurn()}
function bidTurn(){if(phase!=='bid')return;if(turn===0){say('ورقة المشترى '+up.r+up.s+' — اختر شراء أو بس');render();return}setTimeout(()=>{if(phase!=='bid')return;let h=hands[turn],strength=h.filter(c=>c.s===up.s).length,high=h.filter(c=>c.r==='A'||c.r==='J').length;if(strength>=3){choose('hokm',turn)}else if(high>=4){choose('sun',turn)}else pass(turn)},450)}
function pass(i){if(phase!=='bid'||i!==turn)return;passes++;if(passes>=8){dealer=(dealer+1)%4;say('الجميع قال بس، إعادة التوزيع');setTimeout(newDeal,800);return}turn=(turn+1)%4;render();bidTurn()}
function choose(m,i){if(phase!=='bid'||i!==turn)return;mode=m;trump=m==='hokm'?up.s:null;buyer=i;hands[i].push(up);let ix=0;for(let p=0;p<4;p++){let need=p===i?2:3;for(let k=0;k<need;k++)hands[p].push(stock[ix++])}phase='play';leader=(dealer+1)%4;turn=leader;hands.forEach(h=>h.sort((a,b)=>suits.indexOf(a.s)-suits.indexOf(b.s)||rank(a)-rank(b)));say((m==='sun'?'صن':'حكم '+trump)+' — المشتري '+['أنت','أبو ناصر','أبو فهد','أبو سعد'][i]);render();auto()}
function legal(i){let h=hands[i];if(!trick.length)return h.map((_,j)=>j);let lead=trick[0].c.s,same=h.map((c,j)=>c.s===lead?j:-1).filter(j=>j>=0);if(same.length){if(mode==='hokm'&&lead===trump){let high=Math.max(...trick.filter(x=>x.c.s===trump).map(x=>rank(x.c)));let higher=same.filter(j=>rank(h[j])>high);if(higher.length)return higher}return same}if(mode==='hokm'){let cut=h.map((c,j)=>c.s===trump?j:-1).filter(j=>j>=0);let partnerWinning=team(winner().i)===team(i);if(cut.length&&!partnerWinning){let existing=trick.filter(x=>x.c.s===trump);if(existing.length){let high=Math.max(...existing.map(x=>rank(x.c)));let higher=cut.filter(j=>rank(h[j])>high);if(higher.length)return higher}return cut}}return h.map((_,j)=>j)}
function winner(){let lead=trick[0].c.s,best=trick[0];for(let x of trick.slice(1)){if(mode==='hokm'&&x.c.s===trump&&best.c.s!==trump||x.c.s===best.c.s&&rank(x.c)>rank(best.c))best=x}return best}
function play(i,j){if(phase!=='play'||turn!==i||!legal(i).includes(j))return;let c=hands[i].splice(j,1)[0];trick.push({i,c});render();if(trick.length===4){let win=winner().i,t=team(win),pts=trick.reduce((a,x)=>a+value(x.c),0)+(hands.every(h=>h.length===0)?10:0);round[t]+=pts;won[t]++;say(['أنت','أبو ناصر','أبو فهد','أبو سعد'][win]+' أكل '+pts+' بنط');phase='collect';setTimeout(()=>{trick=[];if(hands.every(h=>h.length===0))finish();else{phase='play';turn=win;render();auto()}},900)}else{turn=(turn+1)%4;auto()}}
function auto(){render();if(phase!=='play'||turn===0)return;setTimeout(()=>{if(phase!=='play'||turn===0)return;let i=turn,options=legal(i),lead=trick.length?trick[0].c.s:null;options.sort((a,b)=>{let x=hands[i][a],y=hands[i][b];return (x.s===lead?0:1)-(y.s===lead?0:1)||value(x)-value(y)||rank(x)-rank(y)});play(i,options[0])},550)}
function finish(){let mult=mode==='sun'?2:1;let a=Math.round(round[0]/(mode==='sun'?5:10))*mult,b=Math.round(round[1]/(mode==='sun'?5:10))*mult;if(won[0]===8){a=mode==='sun'?44:25;b=0}if(won[1]===8){b=mode==='sun'?44:25;a=0}if(round[team(buyer)]<=round[1-team(buyer)]){if(team(buyer)===0){b+=a;a=0}else{a+=b;b=0}}scores[0]+=a;scores[1]+=b;phase='done';say('انتهت التوزيعة: نحن +'+a+'، هم +'+b+(Math.max(...scores)>=152?' — انتهت المباراة':' — ابدأ توزيعة جديدة'));render()}
function render(){document.getElementById('score').textContent='نحن '+scores[0]+' — هم '+scores[1];for(let [id,i] of [['n',2],['w',3],['e',1]])document.getElementById(id).textContent=hands[i]?.length+' ورق'+(turn===i?' • الدور':'');document.getElementById('played').innerHTML=trick.map(x=>'<div style="text-align:center"><small>'+['أنت','ناصر','فهد','سعد'][x.i]+'</small>'+card(x.c)+'</div>').join('')||(phase==='bid'?'<div>المشترى '+card(up)+'</div>':'');document.getElementById('hand').innerHTML=(hands[0]||[]).map((c,j)=>'<button class="card '+('♥♦'.includes(c.s)?'red':'')+'" '+(phase==='play'&&turn===0&&legal(0).includes(j)?'':'disabled')+' onclick="play(0,'+j+')"><b>'+c.r+'</b><span class="face">'+c.s+'</span></button>').join('');document.getElementById('picker').innerHTML=phase==='bid'&&turn===0?'<button onclick="choose(\'sun\',0)">صن</button><button onclick="choose(\'hokm\',0)">حكم</button><button onclick="pass(0)">بس</button>':''}
newDeal();
</script></body></html>
