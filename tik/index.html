<style>
:root{--primary-color:#111;--accent-color:#e8e1c9;--white:#fff;--tabby-green:#37b376;--whatsapp-green:#25D366;--bg-gradient:linear-gradient(135deg,#f8f5eb 0%,#e8e1c9 100%)}
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:'Cairo',sans-serif;background:var(--bg-gradient);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:400px;background:var(--white);padding:40px 25px;border-radius:35px;box-shadow:0 20px 50px rgba(0,0,0,.1);text-align:center;position:relative}
.logo-container img{width:120px;height:120px;object-fit:contain;border-radius:50%;border:4px solid var(--accent-color);margin-bottom:15px;background:#fff}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--tabby-green);color:#fff;padding:5px 15px;border-radius:50px;font-size:13px;font-weight:700;margin-bottom:20px}
h1{font-size:30px;font-weight:900;color:var(--primary-color);margin:5px 0}
.p-desc{font-size:17px;color:#555;margin-bottom:30px}
.btn-pulse{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:12px;background:var(--whatsapp-green);color:#fff;text-decoration:none;padding:15px;border-radius:20px;transition:.3s;animation:pulse-animation 2s infinite}
.btn-pulse:hover{background:#1ebe5d}
.btn-content{display:flex;flex-direction:column}
.btn-pulse i{font-size:30px}
.btn-pulse .main-text{font-size:19px;font-weight:700}
.btn-pulse .sub-text{font-size:14px;opacity:.9;margin-top:2px}
@keyframes pulse-animation{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.fallback-section{margin-top:30px;padding-top:20px;border-top:1px dashed #ddd}
.phone-number-box{direction:ltr;display:inline-flex;align-items:center;gap:10px;background:#f8f8f8;padding:10px 20px;border-radius:50px;font-weight:bold;font-size:18px;cursor:pointer;border:1px solid #eee;margin-top:10px;font-family:'Cairo',sans-serif}
.phone-number-box:hover{background:#eee}
.tabby-logo-container{margin-top:30px}
.tabby-logo{width:100px;height:auto;filter:grayscale(.2)}
</style>
</head>
<body>
<div class="card">
<div class="logo-container"><img src="https://up6.cc/2026/04/177735080739821.png" alt="فزاع"></div>
<div class="badge"><i class="fas fa-check-circle"></i> موثوقين ومعتمدين</div>
<h1>سيولة تابي فورية</h1>
<p class="p-desc">استلم كاشك الحين بكل سهولة</p>
<a id="whatsappLink" href="https://wa.me/966565464718" class="btn-pulse" target="_blank" rel="noopener noreferrer">
<i class="fab fa-whatsapp"></i><div class="btn-content"><span class="main-text">للتواصل عبر الواتساب</span><span class="sub-text">اضغط هنا</span></div>
</a>
<div class="fallback-section"><div style="font-size:13px;color:#888">أو انسخ الرقم مباشرة</div>
<button type="button" class="phone-number-box" onclick="copyNum()"><i class="far fa-copy" style="font-size:14px;color:#aaa"></i><span id="displayPhone">+966 56 546 4718</span></button></div>
<div class="tabby-logo-container"><img src="https://i0.wp.com/ksalogo.com/wp-content/uploads/2025/02/Tabby-01.png?fit=1000%2C1000&ssl=1" class="tabby-logo" alt="Tabby"></div>
</div>
<script>
const PHONE_NUMBER='0565464718';
const INTERNATIONAL_NUMBER='966'+PHONE_NUMBER.substring(1);
const WHATSAPP_MESSAGE='سلام عليكم فزاع محتاج سلفة';
const whatsappLink=document.getElementById('whatsappLink');
whatsappLink.href='https://wa.me/'+INTERNATIONAL_NUMBER+'?text='+encodeURIComponent(WHATSAPP_MESSAGE);
document.getElementById('displayPhone').textContent='+966 '+PHONE_NUMBER.substring(1,3)+' '+PHONE_NUMBER.substring(3,6)+' '+PHONE_NUMBER.substring(6);
whatsappLink.addEventListener('click',function(){
 if(window.ttq&&typeof window.ttq.track==='function'){
  window.ttq.track('Contact',{content_name:'WhatsApp Contact',content_type:'product',description:'WhatsApp button click'});
 }
});
async function copyNum(){
 try{
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(PHONE_NUMBER)}
  else{
   const el=document.createElement('textarea');el.value=PHONE_NUMBER;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();const copied=document.execCommand('copy');document.body.removeChild(el);if(!copied)throw new Error('Copy failed');
  }
  alert('تم نسخ الرقم: '+PHONE_NUMBER);
 }catch(error){alert('تعذر النسخ تلقائياً، الرقم: '+PHONE_NUMBER)}
}
</script>
</body>
