<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفتر المحاسبي المتكامل – A4</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Marhey:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sidebar-width: 260px;
            --ink: #1a1a1a;
            --paper: #fff;
            --border: #2c2c2c;
            --shadow: 0 4px 20px rgba(0,0,0,.08);
            --gold: #d4af37;
            --bg-light: #f5f5f0;
            --font-main: "Tajawal", sans-serif;
            --font-arabic: "Amiri", serif;
            --font-numbers: "Marhey", cursive;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-light);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--ink);
        }

        button,
        input {
            font: inherit;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: #1e1e1e;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            right: 0;
            z-index: 100;
            transition: transform .3s cubic-bezier(.4,0,.2,1);
            border-left: 2px solid #000;
            overflow: hidden;
        }

        .sidebar.collapsed {
            transform: translateX(100%);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            padding: 18px 16px;
            border-bottom: 1px solid #333;
            gap: 10px;
            flex-shrink: 0;
        }

        .sidebar-header .logo-svg {
            color: var(--gold);
            flex-shrink: 0;
        }

        .sidebar-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .sidebar-toggle {
            background: none;
            border: 0;
            color: #aaa;
            font-size: 1.4rem;
            cursor: pointer;
            margin-right: auto;
            padding: 0 6px;
        }

        .sidebar-toggle:hover {
            color: #fff;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            padding: 11px 20px;
            color: #ccc;
            text-decoration: none;
            font-size: .92rem;
            border-bottom: 1px solid #2a2a2a;
            transition: .2s;
            gap: 10px;
            cursor: pointer;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background: #2c2c2c;
            color: #fff;
        }

        .sidebar-nav a.active {
            border-right: 4px solid var(--gold);
        }

        .nav-icon {
            width: 24px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 12px;
            text-align: center;
            font-size: .75rem;
            color: #666;
            border-top: 1px solid #2a2a2a;
        }

        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 110;
            background: #1e1e1e;
            color: #fff;
            border: 0;
            font-size: 1.8rem;
            width: 46px;
            height: 46px;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,.35);
            cursor: pointer;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 90;
            backdrop-filter: blur(2px);
        }

        .main-content {
            flex: 1;
            margin-right: var(--sidebar-width);
            padding: 20px 24px 40px;
            transition: margin .3s cubic-bezier(.4,0,.2,1);
            width: calc(100% - var(--sidebar-width));
            min-height: 100vh;
        }

        .sidebar.collapsed ~ .main-content {
            margin-right: 0;
            width: 100%;
        }

        .toolbar {
            background: #fff;
            border: 1px solid #d0d0d0;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 10px;
            z-index: 50;
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
        }

        .toolbar-left,
        .toolbar-right {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .btn {
            background: #f8f8f8;
            border: 1px solid #bbb;
            padding: 7px 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: .2s;
            font-size: .85rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #222;
        }

        .btn:hover {
            background: #eaeaea;
            border-color: #888;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: #1e1e1e;
            border-color: #1e1e1e;
            color: #fff;
        }

        .btn-success {
            background: #2d7d46;
            border-color: #2d7d46;
            color: #fff;
        }

        .btn-danger {
            background: #b33c3c;
            border-color: #b33c3c;
            color: #fff;
        }

        .current-page-label {
            font-weight: 600;
            font-size: .95rem;
            color: #333;
            background: #f0f0f0;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #ddd;
            white-space: nowrap;
        }

        .page-sheet,
        .page-sheet *,
        .page-sheet *::before,
        .page-sheet *::after {
            box-sizing: border-box;
        }

        .page-sheet {
            background: #fff;
            margin: 0 auto 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            page-break-after: always;
            page-break-inside: avoid;
        }

        .page-sheet.portrait {
            width: 210mm;
            height: 297mm;
            padding: 12mm 10mm 14mm;
        }

        .page-sheet.landscape {
            width: 297mm;
            height: 210mm;
            padding: 10mm 12mm 12mm;
        }

        .page-sheet::after {
            content: "الدفتر المحاسبي";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%) rotate(-30deg);
            font-size: 6rem;
            color: rgba(0,0,0,.025);
            font-family: var(--font-arabic);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            font-weight: 700;
        }

        .page-inner {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #000;
            padding-bottom: 8px;
            margin-bottom: 14px;
            gap: 6px;
            flex: 0 0 auto;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1rem;
        }

        .page-title {
            font-family: var(--font-arabic);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .page-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #000;
            padding-top: 6px;
            font-size: .8rem;
            font-weight: 500;
            color: #333;
            font-family: var(--font-numbers);
            flex: 0 0 auto;
        }

        .cover-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 3px double #000;
            padding: 20px;
            flex: 1 1 auto;
            min-height: 0;
        }

        .cover-border {
            width: 85%;
            max-width: 500px;
            border: 2px solid #000;
            padding: 35px 20px 28px;
            background: #fcfcfc;
        }

        .cover-logo svg {
            width: 72px;
            height: 72px;
        }

        .cover-title {
            font-family: var(--font-arabic);
            font-size: 2.6rem;
            margin: 16px 0 4px;
            letter-spacing: 2px;
        }

        .cover-divider {
            width: 100px;
            height: 3px;
            background: #000;
            margin: 14px auto;
        }

        .cover-subtitle {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .cover-year {
            font-size: 1.1rem;
            border: 1px solid #000;
            display: inline-block;
            padding: 6px 28px;
            margin-bottom: 24px;
        }

        .cover-info p {
            font-size: 1rem;
            margin: 8px 0;
            border-bottom: 1px dashed #aaa;
            padding-bottom: 4px;
        }

        .cover-stamp {
            margin-top: 20px;
            border: 2px solid #000;
            padding: 10px 28px;
            display: inline-block;
            font-weight: 700;
            transform: rotate(-4deg);
        }

        .company-details {
            padding: 8px 0;
            flex: 1 1 auto;
            min-height: 0;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }

        .info-table td {
            padding: 8px 6px;
        }

        .info-table .label {
            font-weight: 700;
            width: 30%;
            white-space: nowrap;
        }

        .info-table .lined {
            border-bottom: 1px dashed #999;
        }

        .info-table input {
            border: 0;
            background: transparent;
            width: 100%;
            padding: 2px 4px;
            outline: 0;
        }

        .company-barcode-section {
            margin-top: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .company-barcode-section > div {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .table-responsive {
            width: 100%;
            overflow: hidden;
            flex: 1 1 auto;
            min-height: 0;
        }

        .ledger-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            font-family: var(--font-numbers);
            font-size: .78rem;
            line-height: 1.25;
        }

        .ledger-table th {
            background: #f0f0f0;
            border: 1px solid #000;
            padding: 4px 3px;
            font-weight: 700;
            text-align: center;
            font-family: var(--font-main);
            font-size: .72rem;
            overflow-wrap: anywhere;
        }

        .ledger-table td {
            border: 1px solid #000;
            padding: 2px 4px;
            vertical-align: middle;
            height: 5.1mm;
            min-height: 5.1mm;
            overflow: hidden;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .ledger-table td[contenteditable="true"] {
            outline: 0;
            cursor: text;
        }

        .ledger-table td[contenteditable="true"]:focus {
            background: #fffbe6;
            box-shadow: inset 0 0 0 2px var(--gold);
        }

        .ledger-table tbody tr:nth-child(even) td {
            background: #fafafa;
        }

        .ledger-table thead {
            display: table-header-group;
        }

        .ledger-table tbody tr {
            page-break-inside: avoid;
        }

        .notes-area {
            flex: 1 1 auto;
            min-height: 0;
            background: repeating-linear-gradient(#fff,#fff 29px,#e0e0e0 30px);
            border: 1px solid #aaa;
            margin-top: 10px;
            padding: 8px 14px;
            font-size: .95rem;
            line-height: 30px;
            outline: 0;
            overflow: hidden;
        }

        .index-table td {
            text-align: center;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1e1e1e;
            color: #fff;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: .9rem;
            box-shadow: 0 6px 30px rgba(0,0,0,.3);
            z-index: 200;
            opacity: 0;
            transition: all .4s cubic-bezier(.4,0,.2,1);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { border-right: 4px solid #4caf50; }
        .toast.error { border-right: 4px solid #f44336; }
        .toast.info { border-right: 4px solid #2196f3; }

        @page {
            size: A4 portrait;
            margin: 0;
        }

        @page portraitPage {
            size: A4 portrait;
            margin: 0;
        }

        @page landscapePage {
            size: A4 landscape;
            margin: 0;
        }

        @media print {
            html,
            body {
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
                overflow: visible !important;
            }

            body {
                display: block !important;
            }

            .sidebar,
            .mobile-menu-btn,
            .toolbar,
            .overlay,
            .toast,
            .no-print {
                display: none !important;
            }

            .main-content,
            #pagesContainer {
                display: block !important;
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
                overflow: visible !important;
            }

            .page-sheet {
                display: block !important;
                margin: 0 auto !important;
                box-shadow: none !important;
                border: 0 !important;
                border-radius: 0 !important;
                background: #fff !important;
                overflow: hidden !important;
                break-inside: avoid !important;
                page-break-inside: avoid !important;
                break-after: page !important;
                page-break-after: always !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .page-sheet.portrait {
                page: portraitPage;
                width: 210mm !important;
                height: 297mm !important;
                min-width: 210mm !important;
                max-width: 210mm !important;
                min-height: 297mm !important;
                max-height: 297mm !important;
                padding: 12mm 10mm 14mm !important;
            }

            .page-sheet.landscape {
                page: landscapePage;
                width: 297mm !important;
                height: 210mm !important;
                min-width: 297mm !important;
                max-width: 297mm !important;
                min-height: 210mm !important;
                max-height: 210mm !important;
                padding: 10mm 12mm 12mm !important;
            }

            .page-inner {
                width: 100% !important;
                height: 100% !important;
                min-height: 0 !important;
                display: flex !important;
                flex-direction: column !important;
                overflow: hidden !important;
            }

            .page-header {
                margin-bottom: 4mm !important;
                padding-bottom: 2mm !important;
            }

            .page-footer {
                margin-top: auto !important;
                padding-top: 2mm !important;
            }

            .table-responsive {
                overflow: hidden !important;
            }

            .ledger-table {
                width: 100% !important;
                table-layout: fixed !important;
                font-size: 7pt !important;
                line-height: 1.15 !important;
            }

            .ledger-table th {
                height: 7mm !important;
                padding: 1mm .8mm !important;
                font-size: 6.7pt !important;
                line-height: 1.1 !important;
                background: #f0f0f0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .ledger-table td {
                height: 5mm !important;
                min-height: 5mm !important;
                padding: .5mm .8mm !important;
                font-size: 6.7pt !important;
                line-height: 1.1 !important;
            }

            .ledger-table tbody tr:nth-child(even) td {
                background: #fafafa !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .ledger-table td[contenteditable="true"],
            .ledger-table td[contenteditable="true"]:focus,
            .ledger-table td[contenteditable="true"]:hover {
                box-shadow: none !important;
            }

            .page-sheet::after {
                font-size: 45pt !important;
            }

            .cover-content {
                height: 100% !important;
                min-height: 0 !important;
            }

            .notes-area {
                min-height: 0 !important;
                overflow: hidden !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            #qrcode img,
            #qrcode canvas {
                width: 25mm !important;
                height: 25mm !important;
            }

            .page-sheet:last-child {
                break-after: auto !important;
                page-break-after: auto !important;
            }
        }

        @media screen and (max-width: 1024px) {
            .page-sheet.portrait,
            .page-sheet.landscape {
                width: 100%;
                height: auto;
                min-height: 600px;
                padding: 20px 16px;
            }
        }

        @media screen and (max-width: 768px) {
            :root { --sidebar-width: 280px; }

            .sidebar {
                transform: translateX(100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-right: 0 !important;
                width: 100% !important;
                padding: 14px 12px 30px !important;
            }

            .mobile-menu-btn {
                display: block;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
                top: 0;
                border-radius: 0 0 10px 10px;
            }

            .toolbar-left,
            .toolbar-right {
                justify-content: center;
            }

            .page-sheet {
                margin-bottom: 18px;
            }

            .page-sheet.portrait,
            .page-sheet.landscape {
                min-height: 480px;
                padding: 14px 12px;
            }

            .ledger-table {
                font-size: .65rem;
            }

            .ledger-table th {
                font-size: .6rem;
            }
        }

        @media screen and (max-width: 480px) {
            .main-content {
                padding: 10px 8px 20px !important;
            }

            .page-sheet.portrait,
            .page-sheet.landscape {
                min-height: 380px;
                padding: 10px 8px;
            }

            .btn {
                font-size: .7rem;
                padding: 4px 10px;
            }

            .ledger-table {
                font-size: .55rem;
            }

            .ledger-table th {
                font-size: .5rem;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <svg class="logo-svg" viewBox="0 0 64 64" width="40" height="40">
                <circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="3"/>
                <path d="M20 20h24v24H20z" fill="none" stroke="currentColor" stroke-width="2"/>
                <line x1="28" y1="20" x2="28" y2="44" stroke="currentColor" stroke-width="2"/>
                <line x1="20" y1="28" x2="44" y2="28" stroke="currentColor" stroke-width="2"/>
            </svg>
            <h2>الدفتر المحاسبي</h2>
            <button class="sidebar-toggle" id="sidebarToggle" type="button">☰</button>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">© 2026 – نسخة احترافية</div>
    </aside>

    <button class="mobile-menu-btn" id="mobileMenuBtn" type="button">☰</button>
    <div class="overlay" id="overlay"></div>
    <div class="toast" id="toast"></div>

    <main class="main-content">
        <div class="toolbar no-print">
            <div class="toolbar-left">
                <button class="btn" id="btnPrint" type="button">🖨️ طباعة الصفحة</button>
                <button class="btn btn-primary" id="btnPdf" type="button">📄 PDF</button>
                <button class="btn btn-success" id="btnExcel" type="button">📊 Excel</button>
                <button class="btn" id="btnPrintAll" type="button">📚 طباعة الكل</button>
                <button class="btn" id="btnSave" type="button">💾 حفظ</button>
                <button class="btn btn-danger" id="btnReset" type="button">🗑️ إعادة ضبط</button>
            </div>
            <div class="toolbar-right">
                <span class="current-page-label" id="currentPageLabel">غلاف الدفتر</span>
                <span id="saveStatus" style="font-size:.75rem;color:#888">✓ محفوظ</span>
            </div>
        </div>

        <div id="pagesContainer"></div>
    </main>

    <script>
        (() => {
            "use strict";

            const ROWS_PER_PAGE = 25;
            const SAVE_DEBOUNCE_MS = 800;
            const STORAGE_KEY = "ledger_data_v3";

            const PAGE_DEFS = [
                { id: "cover", title: "غلاف الدفتر", type: "cover", orientation: "portrait" },
                { id: "company", title: "بيانات المؤسسة", type: "company", orientation: "portrait" },
                { id: "index", title: "الفهرس", type: "index", orientation: "portrait" },
                { id: "journal", title: "دفتر اليومية", type: "journal", orientation: "landscape" },
                { id: "ledger", title: "دفتر الأستاذ", type: "ledger", orientation: "landscape" },
                { id: "purchases", title: "سجل المشتريات", type: "purchases", orientation: "landscape" },
                { id: "sales", title: "سجل المبيعات", type: "sales", orientation: "landscape" },
                { id: "inventory", title: "سجل المخزون", type: "inventory", orientation: "landscape" },
                { id: "clients", title: "سجل العملاء", type: "clients", orientation: "landscape" },
                { id: "suppliers", title: "سجل الموردين", type: "suppliers", orientation: "landscape" },
                { id: "revenues", title: "سجل الإيرادات", type: "revenues", orientation: "landscape" },
                { id: "expenses", title: "سجل المصروفات", type: "expenses", orientation: "landscape" },
                { id: "cash", title: "سجل الصندوق", type: "cash", orientation: "landscape" },
                { id: "bank", title: "سجل البنك", type: "bank", orientation: "landscape" },
                { id: "monthly", title: "ملخص شهري", type: "monthly", orientation: "portrait" },
                { id: "yearly", title: "ملخص سنوي", type: "yearly", orientation: "portrait" },
                { id: "stocktaking", title: "جرد المخزون", type: "stocktaking", orientation: "landscape" },
                { id: "notes", title: "صفحة الملاحظات", type: "notes", orientation: "portrait" }
            ];

            const TABLE_COLUMNS = {
                journal: ["م","التاريخ","البيان","رقم المستند","مدين","دائن","الرصيد","الملاحظات"],
                ledger: ["م","التاريخ","البيان","رقم المستند","مدين","دائن","الرصيد","الملاحظات"],
                purchases: ["م","التاريخ","البيان","رقم الفاتورة","المورد","القيمة","الضريبة","الإجمالي","الملاحظات"],
                sales: ["م","التاريخ","البيان","رقم الفاتورة","العميل","القيمة","الضريبة","الإجمالي","الملاحظات"],
                inventory: ["م","التاريخ","الصنف","الوحدة","وارد","منصرف","الرصيد","سعر الوحدة","الملاحظات"],
                clients: ["م","الرقم","اسم العميل","الهاتف","البريد الإلكتروني","الرصيد","الملاحظات"],
                suppliers: ["م","الرقم","اسم المورد","الهاتف","البريد الإلكتروني","الرصيد","الملاحظات"],
                revenues: ["م","التاريخ","البيان","المصدر","المبلغ","طريقة الدفع","الملاحظات"],
                expenses: ["م","التاريخ","البيان","البند","المبلغ","طريقة الدفع","الملاحظات"],
                cash: ["م","التاريخ","البيان","وارد","منصرف","الرصيد","الملاحظات"],
                bank: ["م","التاريخ","البيان","إيداع","سحب","الرصيد","الملاحظات"],
                monthly: ["م","البند","مدين","دائن","الرصيد","ملاحظات"],
                yearly: ["م","الشهر","إجمالي الإيرادات","إجمالي المصروفات","صافي الربح","ملاحظات"],
                stocktaking: ["م","الصنف","الوحدة","الرصيد الدفتري","الجرد الفعلي","الفرق","الملاحظات"]
            };

            const sidebar = document.getElementById("sidebar");
            const sidebarNav = document.getElementById("sidebarNav");
            const pagesContainer = document.getElementById("pagesContainer");
            const currentPageLabel = document.getElementById("currentPageLabel");
            const saveStatus = document.getElementById("saveStatus");
            const toast = document.getElementById("toast");
            const overlay = document.getElementById("overlay");

            let saveTimer = null;
            let toastTimer = null;

            function showToast(message, type = "info") {
                clearTimeout(toastTimer);
                toast.textContent = message;
                toast.className = `toast ${type}`;
                requestAnimationFrame(() => toast.classList.add("show"));
                toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
            }

            function getColumns(type) {
                return TABLE_COLUMNS[type] || ["م","البيان","الملاحظات"];
            }

            function coverHTML() {
                return `
                    <div class="cover-content">
                        <div class="cover-border">
                            <div class="cover-logo">
                                <svg viewBox="0 0 64 64">
                                    <circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="3"/>
                                    <path d="M20 20h24v24H20z" fill="none" stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </div>
                            <h1 class="cover-title">الدفتر المحاسبي</h1>
                            <div class="cover-divider"></div>
                            <p class="cover-subtitle">نسخة احترافية متكاملة</p>
                            <p class="cover-year">السنة المالية: 20____ / 20____</p>
                            <div class="cover-info">
                                <p>اسم المؤسسة: <span contenteditable="true">________________</span></p>
                                <p>المدير المالي: <span contenteditable="true">________________</span></p>
                            </div>
                            <div id="qrcode" style="display:inline-block;margin:16px auto 8px"></div>
                            <div class="cover-stamp">ختم المؤسسة</div>
                        </div>
                    </div>
                `;
            }

            function companyHTML() {
                return `
                    <div class="company-details">
                        <table class="info-table">
                            <tr><td class="label">اسم المؤسسة:</td><td class="lined"><input data-field="company_name"></td></tr>
                            <tr><td class="label">العنوان:</td><td class="lined"><input data-field="company_address"></td></tr>
                            <tr><td class="label">الهاتف:</td><td class="lined"><input data-field="company_phone"></td></tr>
                            <tr><td class="label">السجل التجاري:</td><td class="lined"><input data-field="company_reg"></td></tr>
                            <tr><td class="label">الرقم الضريبي:</td><td class="lined"><input data-field="company_tax"></td></tr>
                        </table>
                        <div class="company-barcode-section">
                            <div><strong>باركود المؤسسة:</strong><svg id="barcode"></svg></div>
                            <div><strong>QR معلومات:</strong><div id="companyQR"></div></div>
                        </div>
                    </div>
                `;
            }

            function createSheet(def, pageIndex, totalPages) {
                const el = document.createElement("section");
                el.className = `page-sheet ${def.orientation}`;
                el.id = `${def.id}-${pageIndex}`;
                el.dataset.pageId = def.id;
                el.dataset.pageType = def.type;

                let body = "";
                if (def.type === "cover") body = coverHTML();
                else if (def.type === "company") body = companyHTML();
                else if (def.type === "index") {
                    body = `<div class="table-responsive"><table class="ledger-table index-table">
                        <thead><tr><th>#</th><th>اسم الصفحة</th><th>رقم الصفحة</th></tr></thead>
                        <tbody id="indexTbody"></tbody>
                    </table></div>`;
                } else if (def.type === "notes") {
                    body = `<div class="notes-area" contenteditable="true"></div>`;
                } else {
                    const headers = getColumns(def.type).map(col => `<th>${col}</th>`).join("");
                    body = `<div class="table-responsive"><table class="ledger-table" data-table-type="${def.type}">
                        <thead><tr>${headers}</tr></thead><tbody></tbody>
                    </table></div>`;
                }

                el.innerHTML = `
                    <div class="page-inner">
                        <div class="page-header">
                            <div class="header-logo">
                                <svg viewBox="0 0 24 24" width="24" height="24">
                                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                                    <path d="M8 8h8v8H8z" fill="none" stroke="currentColor"/>
                                </svg>
                                الدفتر المحاسبي
                            </div>
                            <h2 class="page-title">${def.title}${totalPages > 1 ? ` (${pageIndex + 1})` : ""}</h2>
                        </div>
                        ${body}
                        <div class="page-footer">
                            <span>التاريخ: ____/____/____</span>
                            <span>الصفحة: <span class="page-num"></span></span>
                        </div>
                    </div>
                `;

                return el;
            }

            function fillRows(tbody, type) {
                const cols = getColumns(type);
                for (let i = 0; i < ROWS_PER_PAGE; i++) {
                    const tr = document.createElement("tr");
                    cols.forEach((col, j) => {
                        const td = document.createElement("td");
                        td.contentEditable = j === 0 ? "false" : "true";
                        td.innerHTML = j === 0 ? String(i + 1) : "&nbsp;";
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                }
            }

            function buildPages() {
                pagesContainer.innerHTML = "";

                PAGE_DEFS.forEach(def => {
                    const total = ["cover","company","index","notes"].includes(def.type) ? 1 : 3;
                    for (let pageIndex = 0; pageIndex < total; pageIndex++) {
                        const sheet = createSheet(def, pageIndex, total);
                        pagesContainer.appendChild(sheet);

                        if (TABLE_COLUMNS[def.type]) {
                            fillRows(sheet.querySelector("tbody"), def.type);
                        }
                    }
                });

                updatePageNumbers();
                buildIndex();
                generateCodes();
                restoreData();
            }

            function buildIndex() {
                const tbody = document.getElementById("indexTbody");
                if (!tbody) return;
                tbody.innerHTML = "";

                document.querySelectorAll(".page-sheet").forEach((sheet, index) => {
                    const title = sheet.querySelector(".page-title")?.textContent || "صفحة";
                    const tr = document.createElement("tr");
                    tr.innerHTML = `<td>${index + 1}</td><td>${title}</td><td>${index + 1}</td>`;
                    tbody.appendChild(tr);
                });
            }

            function updatePageNumbers() {
                const sheets = [...document.querySelectorAll(".page-sheet")];
                sheets.forEach((sheet, index) => {
                    const number = sheet.querySelector(".page-num");
                    if (number) number.textContent = `${index + 1} / ${sheets.length}`;
                });
            }

            function generateCodes() {
                if (window.QRCode) {
                    const coverQR = document.getElementById("qrcode");
                    const companyQR = document.getElementById("companyQR");

                    if (coverQR) {
                        coverQR.innerHTML = "";
                        new QRCode(coverQR, { text: "دفتر محاسبي احترافي - 2026", width: 100, height: 100 });
                    }

                    if (companyQR) {
                        companyQR.innerHTML = "";
                        new QRCode(companyQR, { text: "بيانات المؤسسة", width: 90, height: 90 });
                    }
                }

                if (window.JsBarcode) {
                    const barcode = document.getElementById("barcode");
                    if (barcode) {
                        JsBarcode(barcode, "123456789012", {
                            format: "CODE128",
                            width: 2,
                            height: 50,
                            displayValue: true,
                            fontSize: 14
                        });
                    }
                }
            }

            function buildNav() {
                sidebarNav.innerHTML = "";
                PAGE_DEFS.forEach(def => {
                    const link = document.createElement("a");
                    link.href = `#${def.id}-0`;
                    link.dataset.page = def.id;
                    link.innerHTML = `<span class="nav-icon">📄</span>${def.title}`;
                    link.addEventListener("click", event => {
                        event.preventDefault();
                        document.getElementById(`${def.id}-0`)?.scrollIntoView({ behavior: "smooth" });
                        sidebar.classList.remove("open");
                        overlay.style.display = "none";
                    });
                    sidebarNav.appendChild(link);
                });
            }

            function getActiveSheet() {
                const sheets = [...document.querySelectorAll(".page-sheet")];
                return sheets.reduce((best, sheet) => {
                    const rect = sheet.getBoundingClientRect();
                    const distance = Math.abs(rect.top + rect.height / 2 - innerHeight / 2);
                    return !best || distance < best.distance ? { sheet, distance } : best;
                }, null)?.sheet || sheets[0];
            }

            function updateActiveState() {
                const sheet = getActiveSheet();
                if (!sheet) return;

                currentPageLabel.textContent = sheet.querySelector(".page-title")?.textContent || "صفحة";
                sidebarNav.querySelectorAll("a").forEach(link => {
                    link.classList.toggle("active", link.dataset.page === sheet.dataset.pageId);
                });
            }

            function collectData() {
                const data = {
                    version: 3,
                    company: {},
                    cover: [],
                    notes: "",
                    tables: {}
                };

                document.querySelectorAll(".info-table input").forEach(input => {
                    data.company[input.dataset.field] = input.value;
                });

                document.querySelectorAll(".cover-info span").forEach(span => {
                    data.cover.push(span.innerHTML);
                });

                data.notes = document.querySelector(".notes-area")?.innerHTML || "";

                document.querySelectorAll(".ledger-table[data-table-type]").forEach((table, index) => {
                    const key = `${table.dataset.tableType}_${index}`;
                    data.tables[key] = [...table.querySelectorAll("tbody tr")].map(tr =>
                        [...tr.querySelectorAll("td")].map(td => td.innerHTML)
                    );
                });

                return data;
            }

            function saveData(showMessage = false) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(collectData()));
                    saveStatus.textContent = "✓ محفوظ";
                    saveStatus.style.color = "#2d7d46";
                    if (showMessage) showToast("تم الحفظ بنجاح", "success");
                } catch (error) {
                    console.error(error);
                    saveStatus.textContent = "⚠️ خطأ";
                    saveStatus.style.color = "#b33c3c";
                }
            }

            function debouncedSave() {
                clearTimeout(saveTimer);
                saveStatus.textContent = "⏳ حفظ...";
                saveStatus.style.color = "#e67e22";
                saveTimer = setTimeout(() => saveData(false), SAVE_DEBOUNCE_MS);
            }

            function restoreData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return;
                    const data = JSON.parse(raw);

                    document.querySelectorAll(".info-table input").forEach(input => {
                        if (data.company?.[input.dataset.field] !== undefined) {
                            input.value = data.company[input.dataset.field];
                        }
                    });

                    document.querySelectorAll(".cover-info span").forEach((span, index) => {
                        if (data.cover?.[index] !== undefined) span.innerHTML = data.cover[index];
                    });

                    const notes = document.querySelector(".notes-area");
                    if (notes && data.notes) notes.innerHTML = data.notes;

                    document.querySelectorAll(".ledger-table[data-table-type]").forEach((table, index) => {
                        const key = `${table.dataset.tableType}_${index}`;
                        const savedRows = data.tables?.[key];
                        if (!savedRows) return;

                        [...table.querySelectorAll("tbody tr")].forEach((tr, rowIndex) => {
                            [...tr.querySelectorAll("td")].forEach((td, colIndex) => {
                                if (colIndex === 0) return;
                                if (savedRows[rowIndex]?.[colIndex] !== undefined) {
                                    td.innerHTML = savedRows[rowIndex][colIndex] || "&nbsp;";
                                }
                            });
                        });
                    });

                    saveStatus.textContent = "✓ مستعاد";
                } catch (error) {
                    console.error("Restore error:", error);
                }
            }

            function resetData() {
                if (!confirm("متأكد تبي تحذف جميع البيانات؟")) return;
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }

            function exportExcel() {
                if (!window.XLSX) {
                    showToast("مكتبة Excel غير محملة", "error");
                    return;
                }

                const workbook = XLSX.utils.book_new();

                document.querySelectorAll(".page-sheet").forEach((sheet, index) => {
                    const title = (sheet.querySelector(".page-title")?.textContent || `صفحة ${index + 1}`).slice(0,31);
                    const table = sheet.querySelector(".ledger-table");

                    let worksheet;
                    if (table) {
                        const rows = [...table.querySelectorAll("tr")].map(tr =>
                            [...tr.querySelectorAll("th,td")].map(cell => cell.innerText.trim())
                        );
                        worksheet = XLSX.utils.aoa_to_sheet(rows);
                    } else {
                        worksheet = XLSX.utils.aoa_to_sheet([[title],[sheet.innerText.slice(0,5000)]]);
                    }

                    XLSX.utils.book_append_sheet(workbook, worksheet, title);
                });

                XLSX.writeFile(workbook, "الدفتر_المحاسبي.xlsx");
                showToast("تم تصدير Excel", "success");
            }

            async function exportPdf() {
                if (!window.html2canvas || !window.jspdf) {
                    showToast("مكتبة PDF غير محملة", "error");
                    return;
                }

                const sheets = [...document.querySelectorAll(".page-sheet")];
                if (!sheets.length) return;

                const { jsPDF } = window.jspdf;
                let pdf = null;

                try {
                    showToast("جاري تجهيز PDF...", "info");

                    for (let index = 0; index < sheets.length; index++) {
                        const sheet = sheets[index];
                        const landscape = sheet.classList.contains("landscape");
                        const orientation = landscape ? "landscape" : "portrait";
                        const pageWidth = landscape ? 297 : 210;
                        const pageHeight = landscape ? 210 : 297;

                        const canvas = await html2canvas(sheet, {
                            scale: 2,
                            useCORS: true,
                            allowTaint: false,
                            logging: false,
                            backgroundColor: "#fff",
                            scrollX: 0,
                            scrollY: 0,
                            width: sheet.scrollWidth,
                            height: sheet.scrollHeight,
                            windowWidth: sheet.scrollWidth,
                            windowHeight: sheet.scrollHeight
                        });

                        const image = canvas.toDataURL("image/jpeg", .98);

                        if (!pdf) {
                            pdf = new jsPDF({ orientation, unit: "mm", format: "a4", compress: true });
                        } else {
                            pdf.addPage("a4", orientation);
                        }

                        pdf.addImage(image, "JPEG", 0, 0, pageWidth, pageHeight, undefined, "FAST");
                    }

                    pdf.save("الدفتر_المحاسبي_A4.pdf");
                    showToast("تم تصدير PDF بمقاس A4", "success");
                } catch (error) {
                    console.error(error);
                    showToast(`تعذر تصدير PDF: ${error.message}`, "error");
                }
            }

            function printActive() {
                const active = getActiveSheet();
                if (!active) return;

                const sheets = [...document.querySelectorAll(".page-sheet")];
                sheets.forEach(sheet => sheet.classList.add("print-hidden"));
                active.classList.remove("print-hidden");

                const style = document.createElement("style");
                style.id = "singlePrintStyle";
                style.textContent = "@media print{.print-hidden{display:none!important}}";
                document.head.appendChild(style);

                window.print();

                setTimeout(() => {
                    document.getElementById("singlePrintStyle")?.remove();
                    sheets.forEach(sheet => sheet.classList.remove("print-hidden"));
                }, 500);
            }

            function bindEvents() {
                document.getElementById("sidebarToggle").addEventListener("click", () => {
                    sidebar.classList.toggle("collapsed");
                });

                document.getElementById("mobileMenuBtn").addEventListener("click", () => {
                    sidebar.classList.toggle("open");
                    overlay.style.display = sidebar.classList.contains("open") ? "block" : "none";
                });

                overlay.addEventListener("click", () => {
                    sidebar.classList.remove("open");
                    overlay.style.display = "none";
                });

                document.getElementById("btnPrint").addEventListener("click", printActive);
                document.getElementById("btnPrintAll").addEventListener("click", () => window.print());
                document.getElementById("btnPdf").addEventListener("click", exportPdf);
                document.getElementById("btnExcel").addEventListener("click", exportExcel);
                document.getElementById("btnSave").addEventListener("click", () => saveData(true));
                document.getElementById("btnReset").addEventListener("click", resetData);

                document.addEventListener("input", event => {
                    if (event.target.matches("input,[contenteditable='true']")) debouncedSave();
                });

                let scrollTimer = null;
                window.addEventListener("scroll", () => {
                    if (scrollTimer) return;
                    scrollTimer = setTimeout(() => {
                        updateActiveState();
                        scrollTimer = null;
                    }, 120);
                });

                document.addEventListener("keydown", event => {
                    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
                        event.preventDefault();
                        saveData(true);
                    }
                });

                window.addEventListener("beforeunload", () => {
                    if (saveTimer) saveData(false);
                });
            }

            function init() {
                buildNav();
                buildPages();
                bindEvents();
                updateActiveState();
                showToast("الدفتر المحاسبي جاهز", "info");
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
