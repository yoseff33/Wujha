<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>إتمام الطلب | وجهة</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="assets/css/home.css"></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="./">وجهة<span>.</span></a><nav><a href="marketplace/">متابعة التسوق</a><a href="refund-policy/">سياسة الاسترجاع</a></nav></div></header><main class="section wrap"><div class="rank-grid"><section><span class="eyebrow">إتمام الطلب</span><h1>بيانات الشحن</h1><form id="checkoutForm" class="checkout-form"><div class="checkout-account-head"><p id="accountDataStatus">جارٍ تعبئة بيانات حسابك...</p><button id="editCustomerData" type="button">تعديل البيانات</button></div><label>الاسم الكامل<input name="name" autocomplete="name" required readonly></label><label>رقم الجوال<input name="phone" autocomplete="tel" required inputmode="numeric" placeholder="05xxxxxxxx" readonly></label><label>البريد الإلكتروني<input name="email" autocomplete="email" type="email" required dir="ltr" placeholder="name@example.com" readonly></label><label>المدينة<input name="city" autocomplete="address-level2" required></label><label>العنوان الوطني أو وصف العنوان<textarea name="address" autocomplete="street-address" required></textarea></label><button id="checkoutSubmit" type="submit">الانتقال للدفع التجريبي</button><p id="checkoutMessage"></p></form></section><aside><h2>ملخص الطلب</h2><div id="checkoutItems"></div><p class="price">الإجمالي: <b id="checkoutTotal"></b></p></aside></div></main><script type="module" src="assets/js/checkout.js"></script></body></html>
